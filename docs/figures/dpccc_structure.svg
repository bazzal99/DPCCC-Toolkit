<svg viewBox="0 0 820 340" xmlns="http://www.w3.org/2000/svg" font-family="serif" font-size="13">

  <!-- Background -->
  <rect width="820" height="340" fill="#fafafa" rx="8"/>
  <text x="410" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Fig. 2 — DPCCC Structure (L decompositions)</text>

  <!-- d1 input label -->
  <text x="18" y="78" font-size="13" font-style="italic" fill="#333">d₁</text>
  <line x1="35" y1="75" x2="80" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ===================== Row 1: C1 / P1 ===================== -->
  <!-- Identity interleaver box -->
  <rect x="80" y="60" width="70" height="28" rx="4" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="115" y="79" text-anchor="middle" font-size="12">Π₁ = I</text>
  <line x1="150" y1="75" x2="195" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- C1 encoder -->
  <rect x="195" y="60" width="55" height="28" rx="4" fill="#e8f8e8" stroke="#4caf50" stroke-width="1.5"/>
  <text x="222" y="79" text-anchor="middle" font-size="12">C₁</text>
  <line x1="250" y1="75" x2="295" y2="75" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- P1 puncturing -->
  <rect x="295" y="60" width="55" height="28" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="322" y="79" text-anchor="middle" font-size="12">𝒫₁</text>
  <line x1="350" y1="75" x2="760" y2="75" stroke="#333" stroke-width="1.5"/>

  <!-- d1 split arrow going down to subframes -->
  <line x1="35" y1="75" x2="35" y2="295" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="38" y="175" font-size="10" fill="#888">decompose</text>

  <!-- ===================== Row 2: subframe d'₂ ===================== -->
  <!-- Decompose box -->
  <rect x="50" y="120" width="45" height="25" rx="3" fill="#f0e8ff" stroke="#9c27b0" stroke-width="1.2"/>
  <text x="72" y="137" text-anchor="middle" font-size="10">⌊K/L⌋</text>
  <line x1="95" y1="132" x2="135" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- d'2 label -->
  <text x="98" y="125" font-size="11" font-style="italic" fill="#555">d'₂</text>
  <!-- Pi2 -->
  <rect x="135" y="119" width="55" height="25" rx="4" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="162" y="136" text-anchor="middle" font-size="12">Π₂</text>
  <line x1="190" y1="132" x2="225" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- d2 label -->
  <text x="196" y="125" font-size="11" font-style="italic" fill="#555">d₂</text>
  <!-- C2 -->
  <rect x="225" y="119" width="55" height="25" rx="4" fill="#e8f8e8" stroke="#4caf50" stroke-width="1.5"/>
  <text x="252" y="136" text-anchor="middle" font-size="12">C₂</text>
  <line x1="280" y1="132" x2="320" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- P2 -->
  <rect x="320" y="119" width="55" height="25" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="347" y="136" text-anchor="middle" font-size="12">𝒫₂</text>
  <line x1="375" y1="132" x2="760" y2="132" stroke="#333" stroke-width="1.5"/>

  <!-- ===================== Dots row ===================== -->
  <text x="205" y="175" text-anchor="middle" font-size="18" fill="#666">⋮</text>
  <text x="252" y="175" text-anchor="middle" font-size="18" fill="#666">⋮</text>
  <text x="347" y="175" text-anchor="middle" font-size="18" fill="#666">⋮</text>

  <!-- ===================== Row 3: subframe d'_{L+1} ===================== -->
  <rect x="50" y="205" width="45" height="25" rx="3" fill="#f0e8ff" stroke="#9c27b0" stroke-width="1.2"/>
  <text x="72" y="222" text-anchor="middle" font-size="10">⌊K/L⌋</text>
  <line x1="95" y1="217" x2="135" y2="217" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="98" y="210" font-size="11" font-style="italic" fill="#555">d'_{L+1}</text>
  <rect x="135" y="204" width="55" height="25" rx="4" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="162" y="221" text-anchor="middle" font-size="12">Π_{L+1}</text>
  <line x1="190" y1="217" x2="225" y2="217" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="225" y="204" width="55" height="25" rx="4" fill="#e8f8e8" stroke="#4caf50" stroke-width="1.5"/>
  <text x="252" y="221" text-anchor="middle" font-size="12">C_{L+1}</text>
  <line x1="280" y1="217" x2="320" y2="217" stroke="#333" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="320" y="204" width="55" height="25" rx="4" fill="#fff3e0" stroke="#ff9800" stroke-width="1.5"/>
  <text x="347" y="221" text-anchor="middle" font-size="12">𝒫_{L+1}</text>
  <line x1="375" y1="217" x2="760" y2="217" stroke="#333" stroke-width="1.5"/>

  <!-- ===================== Concatenate block ===================== -->
  <rect x="760" y="55" width="45" height="180" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="782" y="108" text-anchor="middle" font-size="11" fill="#1565c0">C</text>
  <text x="782" y="122" text-anchor="middle" font-size="11" fill="#1565c0">o</text>
  <text x="782" y="136" text-anchor="middle" font-size="11" fill="#1565c0">n</text>
  <text x="782" y="150" text-anchor="middle" font-size="11" fill="#1565c0">c</text>
  <text x="782" y="164" text-anchor="middle" font-size="11" fill="#1565c0">a</text>
  <text x="782" y="178" text-anchor="middle" font-size="11" fill="#1565c0">t</text>
  <text x="782" y="192" text-anchor="middle" font-size="11" fill="#1565c0">.</text>
  <line x1="805" y1="145" x2="815" y2="145" stroke="#1565c0" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- ===================== Legend ===================== -->
  <rect x="60" y="265" width="14" height="14" rx="2" fill="#e8f4f8" stroke="#4a90d9" stroke-width="1.2"/>
  <text x="80" y="276" font-size="11" fill="#333">Interleaver Πq</text>
  <rect x="185" y="265" width="14" height="14" rx="2" fill="#e8f8e8" stroke="#4caf50" stroke-width="1.2"/>
  <text x="205" y="276" font-size="11" fill="#333">RSC Encoder Cq</text>
  <rect x="335" y="265" width="14" height="14" rx="2" fill="#fff3e0" stroke="#ff9800" stroke-width="1.2"/>
  <text x="355" y="276" font-size="11" fill="#333">Puncturing 𝒫q</text>
  <rect x="470" y="265" width="14" height="14" rx="2" fill="#f0e8ff" stroke="#9c27b0" stroke-width="1.2"/>
  <text x="490" y="276" font-size="11" fill="#333">Frame split ⌊K/L⌋</text>

  <!-- ===================== Decomposition rule note ===================== -->
  <text x="60" y="310" font-size="11" fill="#555">Decomposition rule:  d'_q[ℓ] = d₁[ℓL + q − 2],  ∀ ℓ &lt; K/L − 1,   q ∈ [2, L+1]</text>
  <text x="60" y="328" font-size="11" fill="#555">Overall code rate (no puncturing) = 1/3   |   L = number of decompositions</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1565c0"/>
    </marker>
  </defs>
</svg>
