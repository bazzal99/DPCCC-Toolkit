<svg viewBox="0 0 680 240" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <rect width="680" height="240" fill="#fafafa" rx="8"/>
  <text x="340" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a2e">Table I — Estimated mHD vs LTE TC (Algorithm 1)</text>
  <text x="340" y="42" text-anchor="middle" font-size="11" fill="#555">G1 = G(1, 15/13)₈ — no puncturing  |  G2 = G(1, 15/13, 17/13)₈ — with systematic puncturing</text>

  <!-- Table header -->
  <rect x="30" y="55" width="620" height="28" rx="3" fill="#1565c0"/>
  <text x="110" y="74" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Configuration</text>
  <text x="285" y="74" text-anchor="middle" font-size="12" fill="white" font-weight="bold">K = 128</text>
  <text x="400" y="74" text-anchor="middle" font-size="12" fill="white" font-weight="bold">K = 1024</text>
  <text x="540" y="74" text-anchor="middle" font-size="12" fill="white" font-weight="bold">K = 6144</text>
  <line x1="200" y1="55" x2="200" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="340" y1="55" x2="340" y2="230" stroke="#ccc" stroke-width="1"/>
  <line x1="460" y1="55" x2="460" y2="230" stroke="#ccc" stroke-width="1"/>
  <text x="264" y="74" text-anchor="middle" font-size="11" fill="#aef" >G1 / G2</text>
  <text x="378" y="74" text-anchor="middle" font-size="11" fill="#aef" >G1 / G2</text>
  <text x="518" y="74" text-anchor="middle" font-size="11" fill="#aef" >G1 / G2</text>

  <!-- Rows -->
  <!-- L=2 -->
  <rect x="30" y="83" width="620" height="26" fill="#e3f2fd"/>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#333">DPCCC  L = 2</text>
  <text x="285" y="100" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">28 / 32</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">46 / 48</text>
  <text x="540" y="100" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">50 / 48</text>

  <!-- L=4 -->
  <rect x="30" y="109" width="620" height="26" fill="#fff"/>
  <text x="110" y="126" text-anchor="middle" font-size="12" fill="#333">DPCCC  L = 4</text>
  <text x="285" y="126" text-anchor="middle" font-size="12" fill="#1a237e">26 / 31</text>
  <text x="400" y="126" text-anchor="middle" font-size="12" fill="#1a237e">46 / <tspan font-weight="bold">56</tspan></text>
  <text x="540" y="126" text-anchor="middle" font-size="12" fill="#1a237e">51 / 60</text>

  <!-- L=8 -->
  <rect x="30" y="135" width="620" height="26" fill="#e3f2fd"/>
  <text x="110" y="152" text-anchor="middle" font-size="12" fill="#333">DPCCC  L = 8</text>
  <text x="285" y="152" text-anchor="middle" font-size="12" fill="#1a237e">24 / 30</text>
  <text x="400" y="152" text-anchor="middle" font-size="12" fill="#1a237e">45 / 54</text>
  <text x="540" y="152" text-anchor="middle" font-size="12" fill="#1a237e" font-weight="bold">57 / 72</text>

  <!-- L=16 -->
  <rect x="30" y="161" width="620" height="26" fill="#fff"/>
  <text x="110" y="178" text-anchor="middle" font-size="12" fill="#333">DPCCC  L = 16</text>
  <text x="285" y="178" text-anchor="middle" font-size="12" fill="#1a237e">18 / 19</text>
  <text x="400" y="178" text-anchor="middle" font-size="12" fill="#1a237e">42 / 47</text>
  <text x="540" y="178" text-anchor="middle" font-size="12" fill="#1a237e">54 / 64</text>

  <!-- LTE baseline -->
  <rect x="30" y="187" width="620" height="26" fill="#ffebee"/>
  <text x="110" y="204" text-anchor="middle" font-size="12" fill="#c62828" font-weight="bold">LTE TC (baseline)</text>
  <text x="285" y="204" text-anchor="middle" font-size="12" fill="#c62828">16</text>
  <text x="400" y="204" text-anchor="middle" font-size="12" fill="#c62828">26</text>
  <text x="540" y="204" text-anchor="middle" font-size="12" fill="#c62828">27</text>

  <!-- Gain note -->
  <text x="340" y="228" text-anchor="middle" font-size="11" fill="#2e7d32">Best gains: +75% (K=128), +70% (K=1024), +119% (K=6144) using G1 — up to +157% using G2</text>

  <!-- Border -->
  <rect x="30" y="55" width="620" height="158" rx="3" fill="none" stroke="#1565c0" stroke-width="1.5"/>
</svg>
